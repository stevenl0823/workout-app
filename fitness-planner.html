const labels={gym:'健身',basket:'篮球',golf:'高尔夫',swim:'游泳',rest:'休息',recovery:'轻活动'},days=['周一','周二','周三','周四','周五','周六','周日'];const KEY='court-course-planner-v1';const seed=monday(currentDate());let storageOK=true;let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){storageOK=false}if(!data||!data.weeks)data={current:seed,weeks:{},profile:{weight:'',height:'',sets:3,pain:'none',equipment:'full'}};let tab='week',libSearch='',libCat='all';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dayAdd(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function monday(s){const d=new Date(s+'T12:00:00');return dayAdd(s,-((d.getDay()+6)%7))}function currentDate(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function blank(){return Array.from({length:7},()=>['rest'])}function ensure(s){if(!data.weeks[s])data.weeks[s]={schedule:blank(),logs:{},notes:{},generated:null};return data.weeks[s]}let W=()=>ensure(data.current);function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){storageOK=false}}function toast(s){const t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2200)}function switchTab(t){tab=t;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('hidden',x.id!==t));document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}function goWeek(s){data.current=monday(s);ensure(data.current);save();render()}
function toggleDay(i,k){let a=W().schedule[i];if(a.includes(k)){a=a.filter(x=>x!==k)}else if(k==='rest'){a=['rest']}else{a=a.filter(x=>x!=='rest');a.push(k)}W().schedule[i]=a.length?a:['rest'];W().generated=null;save();render()}
function getPreviousActivities(){const p=data.weeks[dayAdd(data.current,-7)];return p?p.schedule[6]:[]}
function gen(){const s=W().schedule,p=data.profile;let gs=s.map((a,i)=>a.includes('gym')?i:-1).filter(i=>i>=0),types={},warn=[];const sports=a=>a?.some(x=>['basket','golf','swim'].includes(x));const before=i=>i===0?getPreviousActivities():s[i-1];const lowerCost=i=>(before(i)?.includes('basket')?5:0)+(sports(s[i+1])?3:0)+(sports(s[i])?6:0)+(sports(before(i))?1:0);if(gs.length===1){types[gs[0]]='full'}else if(gs.length>=2){let ranked=[...gs].sort((a,b)=>lowerCost(a)-lowerCost(b)||a-b),lower=ranked[0];types[lower]='lower';let other=gs.filter(i=>i!==lower);let upper=other.find(i=>!sports(s[i]))??other[0];types[upper]='upper';let rest=other.filter(i=>i!==upper);rest.forEach((i,j)=>{let nearLower=Math.abs(i-lower)<=1,nearUpper=Math.abs(i-upper)<=1;types[i]=gs.length>=4&&!sports(s[i])&&!sports(s[i+1])&&!(nearLower&&nearUpper)&&p.pain!=='flare'?(j%2?'upperLight':'fullLight'):'core'})}
 if(!gs.length)warn.push('本周没有健身房训练；如有条件，可增加1–2次全身力量训练。');if(gs.length>=3)warn.push('连续或密集健身日中安排轻量核心/功能训练，不连续堆叠高强度。');if(s.some(a=>a.filter(x=>['gym','basket','golf','swim'].includes(x)).length>1))warn.push('同一天安排多项运动：健身自动降为轻量；有疲劳时优先保留主要运动。');if(p.pain==='flare')warn.push('腰部症状加重：本周健身自动改为轻量恢复，不进行负重进阶；持续或反复不适建议就医评估。');
 const map={upper:['上肢力量','50–65分钟',['pulldown','row','bench','shoulder','face','triceps','pallof']],lower:['下肢力量','45–60分钟',['legpress','step','curl','calf','bridge','dead']],full:['全身综合力量','50–65分钟',['legpress','curl','row','pulldown','bench','shoulder','face','dead','pallof']],core:['核心 + 功能恢复','25–40分钟',['bird','side','bridge','angel','chin','hip','bike']],upperLight:['轻量上肢','30–40分钟',['row','bench','face','angel','chin']],fullLight:['轻量全身','30–45分钟',['squat','row','bench','bridge','dead']],recover:['腰盆轻量恢复','15–25分钟',['brace','dead','bird','angel','chin','walk']]};
 const gymPlan=gs.map(i=>{let t=types[i];if(p.pain==='flare')t='recover';else if(s[i].filter(x=>['basket','golf','swim'].includes(x)).length)t='core';let [name,time,ids]=map[t];if(p.equipment==='cable')ids=ids.map(x=>x==='legpress'?'squat':x==='curl'?'bridge':x==='bike'?'walk':x).filter((x,j,a)=>a.indexOf(x)===j);let ex=ids.map(id=>({id,sets:['core','recover','upperLight','fullLight'].includes(t)?Math.min(E[id][6],2):(['背部','胸部','肩部','肩背','手臂','下肢'].includes(E[id][2])?p.sets:E[id][6]),reps:E[id][7]}));if((sports(s[i+1])||before(i)?.includes('basket'))&&['full','lower'].includes(t))ex=ex.map(x=>['legpress','squat','step'].includes(x.id)?{...x,sets:Math.min(2,x.sets)}:x);return {i,t,name,time,ex}});return {days:s.map((a,i)=>({i,activities:a,gym:gymPlan.find(x=>x.i===i)||null})),warn};}

function defaults(id){let keys=Object.keys(data.weeks).filter(k=>k<=data.current).sort().reverse();for(let k of keys){let ls=data.weeks[k].logs||{};let vals=Object.entries(ls).reverse().filter(([key,v])=>key.split(':')[1]===id&&v.done&&v.weight!=='').map(([key,v])=>v.weight);if(vals.length)return vals[0]}return E[id][8]||''}
function logKey(i,id,j){return `${i}:${id}:${j}`}function getLog(i,id,j){return W().logs[logKey(i,id,j)]||{done:false,weight:defaults(id),reps:''}}function setLog(i,id,j,field,value){let key=logKey(i,id,j);W().logs[key]={...getLog(i,id,j),[field]:value};save();if(field==='done')renderPlan()}
function fmt(s){return s.slice(5).replace('-','/')};function counts(plan){let n=0,d=0;plan.days.forEach(x=>x.gym?.ex.forEach(e=>{n+=e.sets;for(let j=0;j<e.sets;j++)if(getLog(x.i,e.id,j).done)d++}));return [d,n]}
function weekView(){let s=W().schedule;let stats=['gym','basket','golf','swim'].map(k=>`<div class="stat"><strong>${s.filter(a=>a.includes(k)).length}</strong><small>${labels[k]}日</small></div>`).join('');$('#week').innerHTML=`<section class="panel"><div class="row between"><div><h2>设置本周日程</h2><div class="muted">${data.current} 至 ${dayAdd(data.current,6)}</div></div><div class="row"><button class="btn alt small" data-action="prev">‹ 上周</button><input aria-label="选择周" type="date" id="weekdate" value="${data.current}"><button class="btn alt small" data-action="next">下周 ›</button></div></div><div class="stats">${stats}</div><p class="note">点击每天的运动标签，可同时安排多个运动；选择休息会取消当天其他活动。</p><div class="week">${s.map((a,i)=>`<div class="day"><h3>${days[i]}</h3><div class="date">${fmt(dayAdd(data.current,i))}</div><div class="chips">${Object.entries(labels).map(([k,v])=>`<button aria-pressed="${a.includes(k)}" class="chip ${a.includes(k)?'on':''} ${k==='rest'?'rest':''}" data-day="${i}" data-kind="${k}">${v}</button>`).join('')}</div></div>`).join('')}</div><div class="row"><button class="btn" data-action="generate">生成 / 更新本周计划</button><button class="btn alt small" data-action="swap">高尔夫 → 游泳</button><button class="btn alt small" data-action="copyweek">沿用上周日程</button></div></section><section class="panel"><h2>训练偏好与状态</h2><div class="row"><div class="field"><label for="weight">体重 (lb)</label><input id="weight" type="number" min="60" max="500" value="${esc(data.profile.weight)}"></div><div class="field"><label for="pain">腰骶部当前状态</label><select id="pain"><option value="mild" ${data.profile.pain==='mild'?'selected':''}>轻微 / 稳定（1–3分）</option><option value="none" ${data.profile.pain==='none'?'selected':''}>目前无不适</option><option value="flare" ${data.profile.pain==='flare'?'selected':''}>近期加重 / 动作诱发疼痛</option></select></div><div class="field"><label for="equipment">可用器材</label><select id="equipment"><option value="full" ${data.profile.equipment==='full'?'selected':''}>龙门架 + 哑铃 + 器械</option><option value="cable" ${data.profile.equipment==='cable'?'selected':''}>龙门架 + 哑铃 + Bench</option></select></div><div class="field"><label for="sets">正式力量动作</label><select id="sets"><option value="3" ${data.profile.sets===3?'selected':''}>3组</option><option value="2" ${data.profile.sets===2?'selected':''}>2组（减量）</option></select></div></div><p class="note">目标：减脂保肌、篮球相对力量、肩背与腰盆控制。核心和恢复动作通常只安排1–2组。</p></section><section class="panel"><h2>计划预览</h2>${getPlan().days.map(d=>`<div class="row between history-item"><strong>${days[d.i]} · ${d.activities.map(x=>labels[x]).join(' + ')}</strong><span class="muted">${d.gym?d.gym.name:''}</span></div>`).join('')}${getPlan().warn.map(x=>`<div class="notice">${esc(x)}</div>`).join('')}<button class="btn alt" data-action="openplan">查看动作与打卡</button></section>`}
const advice={basket:'动态热身8–10分钟；先投篮、运球，再逐步增加急停和对抗。若腰痛加重，降低强度。',golf:'热身5–10分钟，从短杆轻挥开始；连续两天打球时留意腰部和前臂疲劳。',swim:'轻至中等强度20–40分钟起步；自由泳或其他舒服泳姿，腰部不适时缩短时间或停止。',rest:'不做正式力量训练；可轻松散步，保持恢复。',recovery:'轻松步行或活动度练习10–25分钟，不追求疲劳。'};
function exerciseHTML(d,e){let a=E[e.id],per=['shoulder','row','bench','squat','step','lateral'].includes(e.id);return `<div class="exercise"><div class="ename">${a[0]} <span class="eng">${a[1]}</span></div><div class="dose">${e.sets}组 × ${e.reps} · ${esc(a[3])}</div><details class="details"><summary>动作说明 / 替代动作</summary><p>${esc(a[4])}</p><p>替代：${esc(a[5])}（替代而非额外加练）</p></details><div class="setrow sethead"><span>完成</span><span>${per?'每手 lb':'重量 lb（自重留空）'}</span><span>实际次数 / 秒</span></div>${Array.from({length:e.sets},(_,j)=>{let l=getLog(d.i,e.id,j);return `<div class="setrow"><label><input type="checkbox" aria-label="${a[0]} 第${j+1}组" data-log="${d.i}:${e.id}:${j}:done" ${l.done?'checked':''}>${j+1}</label><input type="number" min="0" step="any" placeholder="—" aria-label="${a[0]} 第${j+1}组重量" data-log="${d.i}:${e.id}:${j}:weight" value="${esc(l.weight)}"><input type="text" inputmode="decimal" placeholder="${esc(e.reps)}" aria-label="${a[0]} 第${j+1}组实际次数" data-log="${d.i}:${e.id}:${j}:reps" value="${esc(l.reps)}"></div>`}).join('')}</div>`}
function renderPlan(){let p=getPlan(),[d,n]=counts(p);$('#plan').innerHTML=`<section class="panel"><div class="row between"><div><h2>本周训练打卡</h2><span class="muted">${data.current} 至 ${dayAdd(data.current,6)}</span></div><button class="btn alt small" data-action="exporttext">复制 / 导出记录</button></div><div class="row between"><strong>${d}/${n} 训练组</strong><span class="muted">${n?Math.round(d/n*100):0}%</span></div><div class="progress"><span style="width:${n?d/n*100:0}%"></span></div>${p.warn.map(x=>`<div class="notice">${esc(x)}</div>`).join('')}<p class="note">力量动作预留2–3次余力；主动作休息90–150秒，辅助60–90秒。训练前热身5–8分钟。重量仅为历史参考，不是必须使用的重量。</p></section><section class="panel"><div class="plan-grid">${p.days.map(d=>`<article class="plan-day ${dayAdd(data.current,d.i)===currentDate()?'today':''}"><div class="top"><div><h3>${days[d.i]} <span class="muted">${fmt(dayAdd(data.current,d.i))}</span></h3><strong>${d.gym?d.gym.name:d.activities.map(x=>labels[x]).join(' + ')}</strong></div><span class="tag">${d.gym?d.gym.time:d.activities.map(x=>labels[x]).join(' / ')}</span></div>${d.activities.filter(k=>k!=='gym').map(k=>`<p class="note">${labels[k]}：${advice[k]}</p>`).join('')}${d.gym?d.gym.ex.map(e=>exerciseHTML(d,e)).join(''):''}<div class="daynote"><label class="muted" for="note${d.i}">训练反馈 / 疼痛 / 疲劳</label><textarea id="note${d.i}" data-note="${d.i}" placeholder="如最后一组略吃力、腰部1–3分、篮球表现…">${esc(W().notes[d.i]||'')}</textarea></div></article>`).join('')}</div></section><section class="panel"><h2>运动后自查</h2><p>若疼痛比平时明显增加、动作变形或次日症状加重，下次减量或停止诱发动作。若反复持续或影响翻身，建议物理治疗师或运动医学医生评估。新发进行性腿无力、会阴麻木或大小便异常需立即就医。</p></section>`}
function libraryView(){let cats=[...new Set(Object.values(E).map(x=>x[2]))];$('#library').innerHTML=`<section class="panel"><h2>动作库</h2><div class="row"><input type="search" id="searchlib" placeholder="搜索动作 / 英文名称" value="${esc(libSearch)}" style="flex:1"><select id="catlib"><option value="all">全部肌群</option>${cats.map(c=>`<option ${libCat===c?'selected':''}>${c}</option>`).join('')}</select></div><div id="libresults" class="library" style="margin-top:12px"></div></section>`;libraryResults()}
function libraryResults(){let q=libSearch.toLowerCase();$('#libresults').innerHTML=Object.entries(E).filter(([id,a])=>(libCat==='all'||a[2]===libCat)&&a.join(' ').toLowerCase().includes(q)).map(([id,a])=>`<article><span class="tag">${esc(a[2])}</span><h3 style="margin-top:7px">${a[0]}</h3><div class="eng">${a[1]}</div><p class="dose">${a[6]}组 × ${a[7]}</p><p>${a[4]}</p><p class="note">器材：${a[3]} · 替代：${a[5]}</p></article>`).join('')||'<p>没有匹配动作。</p>'}
function historyView(){let keys=Object.keys(data.weeks).sort().reverse();$('#history').innerHTML=`<section class="panel"><h2>历史训练周</h2>${keys.map(k=>`<div class="row between history-item"><div><strong>${k} — ${dayAdd(k,6)}</strong><div class="note">${data.weeks[k].schedule.filter(a=>a.includes('gym')).length}个健身日 · ${Object.values(data.weeks[k].logs||{}).filter(v=>v.done).length}组已打卡</div></div><button class="btn alt small" data-openweek="${k}">打开</button></div>`).join('')}</section><section class="panel"><h2>数据与备份</h2><p>${storageOK?'本页面尝试使用浏览器本地存储保存计划与记录。不同浏览器、设备或文件位置不会自动同步。':'当前环境可能禁止本地保存，请在离开页面前导出备份。'}</p><div class="row"><button class="btn" data-action="backup">导出 JSON 备份</button><button class="btn alt" data-action="import">导入备份</button><input type="file" id="importfile" accept="application/json,.json" class="hidden"></div><p class="note">导入将替换当前应用数据，操作前建议先备份。</p></section><section class="panel"><h2>训练原则</h2><p>每周力量训练可根据运动日程动态分配。减脂以适度热量缺口为主，蛋白质摄入量可根据体重、训练量和个人健康情况调整；不必在连续运动日严格限制碳水。久坐每30–45分钟起身活动几分钟。</p><p>本应用按本地规则排计划，不提供实时 AI 推理、账号或云同步。出现腰骶部不适时不建议自行复位；动作应以舒适和次日恢复为依据。</p></section>`}
function render(){ensure(data.current);if(tab==='week')weekView();if(tab==='plan')renderPlan();if(tab==='library')libraryView();if(tab==='history')historyView()}
function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportText(){let p=getPlan();let out=[`训练周 ${data.current} — ${dayAdd(data.current,6)}`];p.days.forEach(d=>{out.push(`${days[d.i]}：${d.activities.map(k=>labels[k]).join(' + ')} ${d.gym?.name||''}`);d.gym?.ex.forEach(e=>{let ls=Array.from({length:e.sets},(_,j)=>getLog(d.i,e.id,j));out.push(`  ${E[e.id][0]} ${e.sets}组×${e.reps} | `+ls.map((v,j)=>`第${j+1}组 ${v.done?'完成':'未完成'} ${v.weight||'—'} lb / ${v.reps||'未记实际次数'}`).join('；'))});if(W().notes[d.i])out.push('  反馈：'+W().notes[d.i])});download(`训练记录-${data.current}.txt`,out.join('\n'),'text/plain;charset=utf-8');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(out.join('\n')).catch(()=>{});toast('训练记录已导出。')}
 document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab)return switchTab(b.dataset.tab);if(b.dataset.day!==undefined)return toggleDay(+b.dataset.day,b.dataset.kind);if(b.dataset.openweek){goWeek(b.dataset.openweek);return switchTab('week')}switch(b.dataset.action){case'prev':goWeek(dayAdd(data.current,-7));break;case'next':goWeek(dayAdd(data.current,7));break;case'generate':regenerate();break;case'openplan':switchTab('plan');break;case'swap':W().schedule=W().schedule.map(a=>[...new Set(a.map(x=>x==='golf'?'swim':x))]);W().generated=null;save();render();toast('本周高尔夫已替换为游泳');break;case'copyweek':{let p=data.weeks[dayAdd(data.current,-7)];if(!p){toast('尚无上周日程');break}if(confirm('沿用上周日程？当前训练记录会保留。')){W().schedule=p.schedule.map(a=>[...a]);W().generated=null;save();render()}}break;case'exporttext':exportText();break;case'backup':download('fitness-backup-'+data.current+'.json',JSON.stringify(data,null,2),'application/json');break;case'import':$('#importfile').click();break;}});
 document.addEventListener('change',async e=>{let x=e.target;if(x.id==='weekdate'&&x.value)return goWeek(x.value);if(['weight','pain','equipment','sets'].includes(x.id)){if(x.id==='weight'&&(+x.value<60||+x.value>500))return;data.profile[x.id]=['sets','weight'].includes(x.id)?+x.value:x.value;W().generated=null;save();render();return}if(x.dataset.log){let [i,id,j,f]=x.dataset.log.split(':');return setLog(+i,id,+j,f,f==='done'?x.checked:x.value)}if(x.id==='catlib'){libCat=x.value;libraryResults()}if(x.id==='importfile'&&x.files[0]){try{let d=JSON.parse(await x.files[0].text());if(!d.weeks||!d.profile||!/^\d{4}-\d{2}-\d{2}$/.test(d.current)||Object.values(d.weeks).some(w=>!Array.isArray(w.schedule)||w.schedule.length!==7||w.schedule.some(a=>!Array.isArray(a)||a.some(k=>!labels[k]))||!w.logs||!w.notes))throw Error();if(confirm('确定替换当前记录？')){data=d;Object.values(data.weeks).forEach(w=>w.generated=null);save();switchTab('week');toast('备份已导入')}}catch(err){toast('备份格式不正确，未导入。')}}});
 document.addEventListener('input',e=>{let x=e.target;if(x.id==='searchlib'){libSearch=x.value;libraryResults()}if(x.dataset.note!==undefined){W().notes[x.dataset.note]=x.value;save()}if(x.dataset.log&&x.type!=='checkbox'){let [i,id,j,f]=x.dataset.log.split(':');setLog(+i,id,+j,f,x.value)}});
ensure(data.current);save();render();
</script></body></html>
