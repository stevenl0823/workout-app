function isWorkoutObject(value) {
 return value!==null && typeof value==='object' && !Array.isArray(value);
}
function hasWorkoutData(week) {
 return week.schedule?.some(day=>day.some(activity=>activity!=='rest'))
  || ['logs','notes','edits','effort','feedback'].some(field=>Object.keys(week[field]||{}).length);
}
function workoutSnapshot(source) {
 const weeks=Object.fromEntries(Object.entries(source.weeks).map(([date,week])=>{
  const {generated,...stored}=week;
  return [date,stored];
 }));
 return JSON.parse(JSON.stringify({profile:source.profile,weeks}));
}
function sameWorkoutValue(a,b) {
 if(a===b)return true;
 if(Array.isArray(a)&&Array.isArray(b))return a.length===b.length&&a.every((entry,i)=>sameWorkoutValue(entry,b[i]));
 if(!isWorkoutObject(a)||!isWorkoutObject(b))return false;
 const keys=Object.keys(a);
 return keys.length===Object.keys(b).length&&keys.every(key=>own(b,key)&&sameWorkoutValue(a[key],b[key]));
}
function mergeWorkoutValues(base,local,remote,key) {
 if(sameWorkoutValue(local,base))return remote;
 if(sameWorkoutValue(remote,base)||sameWorkoutValue(local,remote))return local;
 if(key==='schedule'&&Array.isArray(local)&&Array.isArray(remote)){
  const prior=Array.isArray(base)?base:blank();
  return local.map((day,i)=>mergeWorkoutValues(prior[i],day,remote[i]));
 }
 if(!isWorkoutObject(local)||!isWorkoutObject(remote))return local;
 const prior=isWorkoutObject(base)?base:{};
 const keys=new Set([...Object.keys(prior),...Object.keys(local),...Object.keys(remote)]);
 return Object.fromEntries([...keys].map(field=>[
  field,mergeWorkoutValues(own(prior,field)?prior[field]:undefined,own(local,field)?local[field]:undefined,own(remote,field)?remote[field]:undefined,field)
 ]).filter(([,value])=>value!==undefined));
}

async function syncWorkouts() {
 const account=syncAccount;
 if(!account||account.running||!syncClient)return;
 if(navigator.onLine===false){
  updateWorkoutSyncStatus('离线 · 修改保存在本机，联网后会同步');
  return;
 }
 account.running=true;
 const table=()=>syncClient.from('workout_sync');
 updateWorkoutSyncStatus('正在同步…');
 try{
  for(let attempt=0;attempt<3;attempt++){
   const read=await table().select('revision,snapshot').eq('user_id',account.id).maybeSingle();
   if(syncAccount!==account)return;
   if(read.error)throw read.error;
   const row=read.data;
   const remote=row?.snapshot||workoutSnapshot(newWorkoutData());
   const sent=workoutSnapshot(data);
   const desired=mergeWorkoutValues(account.base,sent,remote);
   if(!sameWorkoutValue(desired,remote)){
    const write=row
     ? await table().update({snapshot:desired,revision:row.revision+1,updated_at:new Date().toISOString()}).eq('user_id',account.id).eq('revision',row.revision).select('revision').maybeSingle()
     : await table().insert({user_id:account.id,snapshot:desired}).select('revision').maybeSingle();
    if(syncAccount!==account)return;
    if(write.error?.code==='23505'||(!write.error&&!write.data))continue;
    if(write.error)throw write.error;
   }
   const latest=workoutSnapshot(data);
   const merged=mergeWorkoutValues(sent,latest,desired);
   account.base=desired;
   if(!sameWorkoutValue(latest,merged)){
    applyWorkoutSnapshot(merged);
    renderAfterCloudChange();
   }
   persistWorkoutData();
   if(!sameWorkoutValue(merged,desired)){
    updateWorkoutSyncStatus('还有修改待同步');
    scheduleWorkoutSync();
   }else{
    updateWorkoutSyncStatus('已同步');
   }
   return;
  }
  throw new Error('Concurrent workout edits');
 }catch{
  if(syncAccount===account)updateWorkoutSyncStatus('暂未同步 · 修改保存在此浏览器，可重试');
 }finally{
  account.running=false;
 }
}

function workoutEmailProof(input,email){
 const value=input.trim();
 if(/^\d{6,8}$/.test(value))return {email,token:value,type:'email'};
 const url=new URL(value);
 if(url.origin!==WORKOUT_CLOUD_URL||url.pathname!=='/auth/v1/verify')throw new Error('请粘贴健身 App 登录邮件中的链接。');
 const token_hash=url.searchParams.get('token');
 const type=url.searchParams.get('type');
 if(!token_hash||!['magiclink','signup','email'].includes(type))throw new Error('请粘贴完整的登录链接。');
 return {token_hash,type:'email'};
}
async function submitWorkoutAuth(event) {
 const form=event.target;
 if(!['workout-email','workout-verify'].includes(form.id))return;
 event.preventDefault();
 if(loginBusy||!syncClient)return;
 const fields=new FormData(form);
 const sending=form.id==='workout-email';
 loginBusy=true;
 loginMessage=sending?'正在发送…':'正在验证…';
 workoutAccountView();
 try{
  if(sending){
   loginEmail=String(fields.get('email')).trim().toLowerCase();
   if(!/^[^\s@]+@gmail\.com$/.test(loginEmail))throw new Error('请输入 Gmail 地址。');
   const result=await syncClient.auth.signInWithOtp({email:loginEmail,options:{emailRedirectTo:WORKOUT_SITE_URL}});
   if(result.error)throw new Error(result.error.status===429?'发送太频繁，请稍后再试。':'发送失败，请确认该 Gmail 是项目组织的邮箱，再试一次。');
   loginStage='verify';
  }else{
   let proof;
   try{proof=workoutEmailProof(String(fields.get('verification')),loginEmail);}
   catch{throw new Error('请输入邮件里的验证码，或粘贴完整的登录链接。');}
   const result=await syncClient.auth.verifyOtp(proof);
   if(result.error||!result.data.user)throw new Error('登录链接或验证码无效，也可能已使用。请返回并重新发送一封。');
   setWorkoutUser(result.data.user);
  }
  loginMessage='';
 }catch(error){
  loginMessage=error.message||'暂时无法登录，请稍后重试。';
 }finally{
  loginBusy=false;
  if(tab==='account')workoutAccountView();
